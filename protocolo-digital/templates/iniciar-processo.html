<section class="panel content-panel"><div class="section-heading"><div><h3>Dados do processo</h3><p>O processo será associado à mesa selecionada e salvo no banco de dados.</p></div></div>
  <form id="request-form" class="form-grid" style="padding:0 22px 22px">
    <label class="form-field full">Assunto *<input name="assunto" maxlength="200" required placeholder="Assunto do processo"></label>
    <label class="form-field full">Descrição *<textarea name="descricao" maxlength="5000" required placeholder="Descreva o processo"></textarea></label>
    <div class="form-actions form-field full"><button type="button" class="secondary-button" id="cancel-request">Cancelar</button><button type="submit" class="primary-button">Registrar processo</button></div>
  </form>
</section>
