<section class="panel attention-section">
  <div class="section-heading"><div><h3>Aparência</h3><p>As escolhas ficam salvas neste navegador.</p></div></div>
  <div class="setting-row">
    <div><strong>Tema</strong><p>Escolha entre o modo claro e o escuro.</p></div>
    <div class="segmented" role="group" aria-label="Tema">
      <button type="button" data-theme-option="light">Claro</button>
      <button type="button" data-theme-option="dark">Escuro</button>
    </div>
  </div>
  <div class="setting-row">
    <div><strong>Tamanho da fonte</strong><p>Aumente ou diminua o texto de todo o sistema.</p></div>
    <div class="segmented" role="group" aria-label="Tamanho da fonte">
      <button type="button" data-font-option="0.9">Pequena</button>
      <button type="button" data-font-option="1">Normal</button>
      <button type="button" data-font-option="1.15">Grande</button>
    </div>
  </div>
</section>
